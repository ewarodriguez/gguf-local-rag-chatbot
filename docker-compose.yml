name: rag_chatbot_tool

services:
  classification-app:
    build:
      context: .
    image: img_rag_chatbot:latest
    container_name: cont_rag_chatbot
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      # PROTECTS the virtual environment from being overwritten by your local files
      - /app/.venv/
      # COMMENTED OUT: Keeping it simple and independent of host volumes
      # - ./.model_cache:/home/nonroot/.cache
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      # Routes Hugging Face safely to the authorized nonroot home path
      - HF_HOME=/home/nonroot/.cache/huggingface
      # Routes Docling's independent table models out of the container layout
      - DOCLING_SERVE_ARTIFACTS_PATH=/home/nonroot/.cache/docling/models
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


