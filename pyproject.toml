[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"


# 1. RUNTIME DEPENDENCIES (These go into your final app)
dependencies = [
    "docling>=2.129.0",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.0",
    "fg-data-profiling>=4.20.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "llama-cpp-python>=0.3.34",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.60.0",
    "torchvision>=0.28.0",
]




[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
